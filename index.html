        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

        :root {
            --bg: #0b0c10;
            --card-bg: #14161c;
            --gold: #D4AF37;
            --gold-light: #F9F1CC;
            --gold-dark: #997A15;
            --text: #ffffff;
            --muted: #a0a5b5;
            --radius: 20px;
            --border: rgba(212, 175, 55, 0.2);
            --font-en: 'Poppins', sans-serif;
            --font-ar: 'Cairo', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-en);
        }

        html[dir="rtl"] * {
            font-family: var(--font-ar);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top center, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
        }

        .loader-container {
            position: fixed;
            inset: 0;
            background: rgba(11, 12, 16, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite, glowPulse 2s infinite alternate;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
            100% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.6); }
        }

        .hidden {
            display: none !important;
        }

        .top-header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding: 10px 0;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            object-fit: cover;
        }

        .brand-name {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
            letter-spacing: 0.5px;
        }

        .install-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }

        .install-btn:hover {
            background: var(--gold);
            color: #000;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            transform: translateY(-2px);
        }

        .install-btn svg {
            width: 18px;
            height: 18px;
        }

        .header-container {
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            font-size: clamp(2.2rem, 6vw, 4rem);
            font-weight: 900;
            margin-bottom: 15px;
            background: linear-gradient(to right, var(--gold-light), var(--gold), var(--gold-light));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: textShine 4s linear infinite;
        }

        @keyframes textShine { to { background-position: 200% center; } }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 60px;
        }

        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 30px;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transform: translateY(60px) scale(0.95);
            transition: opacity 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                        border-color 0.4s, 
                        box-shadow 0.4s;
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at top right, rgba(212, 175, 55, 0.15), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .tool-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .tool-card.pop,
        .tool-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--gold);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(212, 175, 55, 0.3);
            z-index: 2;
        }

        .tool-card.pop::before,
        .tool-card:hover::before {
            opacity: 1;
        }

        .icon-wrapper {
            width: 65px;
            height: 65px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px;
            color: var(--gold);
            transition: all 0.4s;
            position: relative;
            z-index: 1;
        }

        .tool-card.visible .icon-wrapper {
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
        }

        .tool-card.pop .icon-wrapper,
        .tool-card:hover .icon-wrapper {
            background: var(--gold);
            color: #000;
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.6);
        }

        .icon-wrapper svg {
            width: 32px;
            height: 32px;
        }

        .tool-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text);
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .tool-desc {
            font-size: 0.95rem;
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 30px;
            flex-grow: 1;
            position: relative;
            z-index: 1;
        }

        .btn-main {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: #000;
            z-index: 1;
            text-transform: uppercase;
        }

        .btn-main:hover {
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
            transform: translateY(-3px);
        }

        .btn-main::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: rgba(255, 255, 255, 0.3);
            transform: rotate(45deg) translateY(-100%);
            transition: 0.6s;
        }

        .btn-main:hover::after {
            transform: rotate(45deg) translateY(100%);
        }

        .social-section {
            width: 100%;
            max-width: 900px;
            text-align: center;
            padding: 40px 0;
            border-top: 1px solid var(--border);

            font-size: 1.5rem;

            color: var(--gold-light);
            margin-bottom: 30px;

        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-direction: row;

            height: 60px;

            background: rgba(212, 175, 55, 0.05);

            border-radius: 50%;
            color: var(--text);

        .footer {

            text-align: center;
            color: var(--muted);
            font-size: 0.95rem;
            font-weight: 600;
            padding-bottom: 20px;
            width: 100%;
        }

        bdo, span[dir="ltr"] {
            unicode-bidi: isolate;
        }
    </style>
</head>

                        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v6a5 5 0 0 1-10 0V4z"></path><path d="M7 4H5a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2"></path><path d="M17 4h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"></path></svg>`
                    },
                    {
                        title: "متتبع تحديثات فري فاير",
                        desc: "عداد زمني مباشر ودقيق لتتبع مواعيد تحديثات فري فاير القادمة بدقة.",
                        url: "https://kingofgames02.github.io/Free-Fire-Patch-Tracker/",
                        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`
                    },
                    {
                        title: "أداة فك تشفير ASTC",
                        desc: "أداة ويب سريعة لفك تشفير ملفات ASTC الخاصة باللعبة وعرضها مباشرة داخل المتصفح.",
                        url: "https://kingofgames02.github.io/astc_decoder_app",
                        icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>`
                    }
                ]
            }
        };

        const browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
        const currentLang = browserLang.startsWith('ar') ? 'ar' : 'en';
        let deferredPrompt;

        function applyLanguage() {
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';

            const langData = translations[currentLang];

            document.getElementById('mainTitle').innerHTML = langData.mainTitle;
            document.getElementById('socialTitle').innerHTML = langData.socialTitle;
            document.getElementById('footerText').innerHTML = langData.footer;
            document.getElementById('installText').innerText = langData.installApp;

            renderToolsGrid();
        }

        function renderToolsGrid() {
            const gridContainer = document.getElementById('toolsGrid');
            gridContainer.innerHTML = '';
            
            const langData = translations[currentLang];

            langData.tools.forEach(tool => {
                const cardHTML = `
                    <div class="tool-card">
                        <div class="icon-wrapper">
                            ${tool.icon}
                        </div>
                        <h2 class="tool-title">${tool.title}</h2>
                        <p class="tool-desc">${tool.desc}</p>
                        <a href="${tool.url}" target="_blank" class="btn-main">
                            <span>${langData.btnOpen}</span>
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                        </a>
                    </div>
                `;
                gridContainer.innerHTML += cardHTML;
            });

            initScrollObserver();
        }

        function initScrollObserver() {
            const observerOptions = {
                threshold: 0.25,
                rootMargin: "0px 0px -50px 0px"
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const card = entry.target;
                        card.classList.add('visible');
                        
                        setTimeout(() => {
                            card.classList.add('pop');
                            setTimeout(() => {
                                card.classList.remove('pop');
                            }, 500);
                        }, 50);

                        observer.unobserve(card);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.tool-card').forEach(card => {
                observer.observe(card);
            });
        }

        function initPWA() {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js').catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
                });
            }

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                document.getElementById('installAppBtn').classList.remove('hidden');
            });

            document.getElementById('installAppBtn').addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        document.getElementById('installAppBtn').classList.add('hidden');
                    }
                    deferredPrompt = null;
                }
            });
        }

        window.onload = function() {
            applyLanguage();
            initPWA();
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 600);
        };
    </script>
</body>
</html>
